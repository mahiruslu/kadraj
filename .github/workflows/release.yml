name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Official builds must be signed + notarized; forks fall back to ad-hoc.
      KADRAJ_REQUIRE_SIGNING: ${{ github.repository == 'mahiruslu/kadraj' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Installer tests
        run: /bin/bash Tests/install_test.sh
      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_NAME: ${{ secrets.DEVELOPER_ID_NAME }}
        run: scripts/ci-import-cert.sh
      - name: Bundle
        run: scripts/bundle.sh --version "${GITHUB_REF_NAME#v}" --build "${{ github.run_number }}"
      - name: Notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: scripts/notarize.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v1.3.0-beta.1 are prereleases: never offered as "latest" to installs and updates.
          extra=()
          case "$GITHUB_REF_NAME" in *-*) extra+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/Kadraj.zip dist/Kadraj.zip.sha256 \
            --title "Kadraj ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag "${extra[@]}"
      - name: Update Homebrew tap
        # Stable releases of the official repository only; prereleases stay off Homebrew.
        if: ${{ github.repository == 'mahiruslu/kadraj' && !contains(github.ref_name, '-') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: scripts/update-homebrew-tap.sh "${GITHUB_REF_NAME#v}" "$(cut -d' ' -f1 dist/Kadraj.zip.sha256)"
